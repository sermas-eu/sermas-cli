name: CI

on:
  push:
    branches: ['main', 'feat/**']
  pull_request:

permissions:
  contents: read

# The CLI bundles @sermas/api-client from its sources: the client is checked out
# beside it (main), as in local development and the image's build context.
defaults:
  run:
    working-directory: sermas-cli

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: sermas-cli
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/sermas-api-client
          ref: main
          path: sermas-api-client
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: sermas-cli/.nvmrc
          cache: npm
          cache-dependency-path: |
            sermas-cli/package-lock.json
            sermas-api-client/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: sermas-api-client
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Audit (report only)
        if: always()
        run: npm audit --omit=dev || true

  # On main: semantic-release reads the conventional commits since the last tag,
  # tags the next version, publishes to npm (trusted publishing: no token, with provenance)
  # and writes the GitHub release; the image is pushed with that version and
  # `latest`. Nothing happens when no commit calls for a release.
  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: sermas-cli
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/sermas-api-client
          ref: main
          path: sermas-api-client
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: sermas-cli/.nvmrc
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
        working-directory: sermas-api-client
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --before pins every transitive package to what was published by then
        run: >-
          npx --yes --before=2026-11-08
          -p semantic-release@25.0.9
          -p conventional-changelog-conventionalcommits@9.3.1
          semantic-release
      - name: Released version
        id: version
        run: |
          tag=$(git tag --points-at HEAD --list 'v*' | head -n 1)
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.version != ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.version.outputs.version != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.version.outputs.version != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: sermas-cli
          build-contexts: |
            api-client=sermas-api-client
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cli:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/cli:latest
